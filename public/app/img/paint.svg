<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <!-- Grunge for the big cards: purple smoke, a rough lime spray stroke and its speckles. -->
  <defs>
    <filter id="smoke" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.01" numOctaves="5" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.48  0 0 0 0 0.24  0 0 0 0 0.92  2.6 0 0 0 -1.0"/>
    </filter>
    <filter id="rough" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="8" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="34" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="dots" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="1" seed="3" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 0.84  0 0 0 0 0.95  0 0 0 0 0.23  16 0 0 0 -11" result="d"/>
      <feComposite in="d" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <mask id="near"><path d="M150 330 C200 230 260 170 300 120 S380 20 430 -20" stroke="#fff" stroke-width="110" fill="none" filter="url(#blur)"/></mask>
  </defs>
  <rect width="400" height="300" filter="url(#smoke)"/>
  <g filter="url(#rough)" opacity=".95">
    <path d="M150 330 C200 230 260 170 300 120 S380 20 430 -20" stroke="#d7f23a" stroke-width="46" stroke-linecap="round" fill="none"/>
  </g>
  <rect width="400" height="300" fill="#fff" mask="url(#near)" filter="url(#dots)"/>
</svg>
