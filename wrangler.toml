# BOLSHE Live Center Worker (Cloudflare account i.znamensky, workers.dev subdomain rngn; moved from
# znamteam-903 on 2026-10-15 — the old address forwards every request here, the bot webhook included).
# Secrets (never in this file): TELEGRAM_BOT_TOKEN, ADMIN_IDS, SCHEDULE_SHEET_ID.
name = "bolshe-live-center"
# Pinned: this PC sees two Cloudflare accounts; the Worker, its D1 and R2 live on i.znamensky.
account_id = "f7f0376bf1c44c4e3cef4a24adf1b66a"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
PUBLIC_URL = "https://bolshe-live-center.znamteam-903.workers.dev"
# The Mini App opens through the no-VPN door on the Moscow server (Caddy /etc/hoh-bolshe/bolshe.caddy forwards
# every request here); the bot webhook stays on PUBLIC_URL.
APP_URL = "https://bolshe.109-172-113-187.sslip.io"
# Website sign-in goes through this bot (t.me/<BOT_USERNAME>?start=login_<code>).
BOT_USERNAME = "bolshe_live_center_bot"
SCHEDULE_GID = "548911490"

# Mini App files (public/app/ -> /app/); everything else goes to the Worker.
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "bolshe-live-center"
database_id = "d9bc4eb3-a1e7-49a0-8114-1e95c1f45e1e"
migrations_dir = "migrations"

# Covers of «Больше» broadcasts and player heads, stored for good (see worker/src/media.js).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "bolshe-live-media"

# Cloudflare Images: cuts VK covers down to 640×360 JPEG before they are stored.
[images]
binding = "IMAGES"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
