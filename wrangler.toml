# BOLSHE Live Center Worker (Cloudflare account of HOH, workers.dev subdomain znamteam-903).
# Secrets (never in this file): TELEGRAM_BOT_TOKEN, ADMIN_IDS, SCHEDULE_SHEET_ID.
name = "bolshe-live-center"
# Pinned: this PC sees two Cloudflare accounts; the Worker and its D1 live on the Znamteam one
# until the planned move to i.znamensky (f7f0376b…, *.rngn.workers.dev).
account_id = "9032ec1bd3cb868d89a38453e4bd1a69"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
PUBLIC_URL = "https://bolshe-live-center.znamteam-903.workers.dev"
SCHEDULE_GID = "548911490"

# Mini App files (public/app/ -> /app/); everything else goes to the Worker.
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "bolshe-live-center"
database_id = "40576f9c-1573-42c9-ad58-06750c4392e4"
migrations_dir = "migrations"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
